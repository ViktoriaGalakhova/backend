<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="keywords" content="кофе, отзывы, обратная связь, British Coffee Shop">
    <meta name="description" content="Отзывы British Coffee Shop: добавление, редактирование и сохранение в браузере.">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Отзывы | British Coffee Shop</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/styles/github.min.css">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js" defer></script>

    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.11.1/lib/common.min.js" defer></script>

    <script type="module" src="js/app.js"></script>
</head>
<body>
<header>
    <h1>British Coffee Shop</h1>

    <nav>
        <ul>
            <li><a href="index.html">Главная</a></li>
            <li><a href="menu6.html">Меню</a></li>
            <li><a href="table6.html">Цены</a></li>
            <li><a href="addresses6.html">Адреса</a></li>
            <li><a href="coffee6.html">Всё о кофе</a></li>
            <li><a href="feedback6.html">Отзывы</a></li>
        </ul>
    </nav>
</header>

<main>
    <section>
        <h2>Отзывы</h2>

        <form id="feedbackForm" class="form-card" novalidate>

            <div class="form-row">
                <label for="fbName"><strong>Имя</strong></label><br>

                <input id="fbName" name="name" type="text"
                       required minlength="2" maxlength="40"
                       placeholder="Например, Анна">
            </div>

            <div class="form-row">
                <label for="fbEmail"><strong>Email</strong></label><br>

                <input id="fbEmail" name="email" type="email"
                       required placeholder="name@example.com">
            </div>

            <div class="form-row">
                <label for="fbText"><strong>Отзыв</strong></label><br>

                <textarea id="fbText" name="text"
                          required minlength="10" maxlength="300"
                          rows="4"
                          placeholder="Напиши пару предложений..."></textarea>

                <p class="field-hint">
                    Поддерживается Markdown: **жирный**, *курсив*, списки, ```код```.
                </p>

                <div class="md-preview" id="mdPreview"
                     aria-label="Предпросмотр отзыва (Markdown)"></div>
            </div>

            <button type="submit" class="btn">Добавить</button>

            <p id="formError" class="form-error" aria-live="polite"></p>
        </form>
    </section>

    <section>
        <h2>Список отзывов</h2>

        <div id="feedbackList" class="list"></div>

        <template id="feedbackItemTemplate">
            <div class="item" data-id="">
                <div class="item-head">
                    <div>
                        <div class="item-title"></div>
                        <div class="item-sub"></div>
                    </div>

                    <div class="item-actions">
                        <button type="button" class="btn btn-small js-edit">Редактировать</button>
                        <button type="button" class="btn btn-small btn-danger js-delete">Удалить</button>
                    </div>
                </div>

                <div class="item-text"></div>

                <form class="edit-form is-hidden" novalidate>
                    <textarea class="edit-text" required minlength="10" maxlength="300" rows="3"></textarea>
                    <div class="edit-actions">
                        <button type="submit" class="btn btn-small">Сохранить</button>
                        <button type="button" class="btn btn-small js-cancel">Отмена</button>
                    </div>
                    <p class="edit-error" aria-live="polite"></p>
                </form>
            </div>
        </template>
    </section>
</main>

<footer>
    <p>Email: info@britishcoffeeshop.ru</p>
    <p>&copy; 2025 British Coffee Shop</p>
</footer>
</body>
</html>
