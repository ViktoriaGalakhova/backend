<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="keywords" content="кофе, прайс, цены, напитки, British Coffee Shop" />
  <meta name="description" content="Прайс-лист British Coffee Shop: цены на напитки по объёму порции." />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Цены | British Coffee Shop</title>
  <link rel="stylesheet" href="css/style.css" />
  <script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <h1>British Coffee Shop</h1>
  <nav>
    <ul>
      <li><a href="index.html">Главная</a></li>
      <li><a href="menu6.html">Меню</a></li>
      <li><a href="table6.html">Цены</a></li>
      <li><a href="addresses6.html">Адреса</a></li>
      <li><a href="coffee6.html">Всё о кофе</a></li>
      <li><a href="feedback6.html">Отзывы</a></li>
    </ul>
  </nav>
</header>

<main>
  <section id="price-table" aria-labelledby="price-title">
    <h2 id="price-title">Прайс на напитки (₽)</h2>

    <div class="table-scroll" role="region" aria-label="Таблица цен (горизонтальная прокрутка)">
      <table class="table-grid">
        <thead>
        <tr>
          <th scope="col">Позиция</th>
          <th scope="col">250 мл</th>
          <th scope="col">350 мл</th>
          <th scope="col">450 мл</th>
        </tr>
        </thead>
        <tbody>
        <tr>
          <th scope="row">Капучино</th>
          <td class="num">200</td>
          <td class="num">230</td>
          <td class="num">260</td>
        </tr>
        <tr>
          <th scope="row">Латте</th>
          <td class="num">220</td>
          <td class="num">250</td>
          <td class="num">280</td>
        </tr>
        <tr>
          <th scope="row">Эспрессо</th>
          <td class="num">150</td>
          <td class="num">—</td>
          <td class="num">—</td>
        </tr>
        <tr>
          <th scope="row">Айс-латте</th>
          <td class="num">230</td>
          <td class="num">260</td>
          <td class="num">290</td>
        </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<footer>
  <p>&copy; 2025 British Coffee Shop</p>
</footer>
</body>
</html>
